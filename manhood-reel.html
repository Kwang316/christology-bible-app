  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #07090f;
      --card: rgba(255,255,255,0.035);
      --border: rgba(255,255,255,0.08);
      --text: #f0ece4;
      --text-dim: rgba(240,236,228,0.55);
      --text-faint: rgba(240,236,228,0.3);
      --font-ser: 'Libre Baskerville', Georgia, serif;
      --font-ui:  'Inter', system-ui, sans-serif;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-ui);
      overflow: hidden;
      touch-action: none;
    }

    #reel { position: fixed; inset: 0; overflow: hidden; }

    .reel-card {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: env(safe-area-inset-top, 20px) 28px env(safe-area-inset-bottom, 24px);
      overflow: hidden;
      transform: translateY(100%);
      transition: transform 0.42s cubic-bezier(0.4, 0, 0.2, 1);
      pointer-events: none;
    }
    .reel-card.active  { transform: translateY(0);    pointer-events: auto; }
    .reel-card.prev    { transform: translateY(-100%); pointer-events: none; }

    .reel-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 90% 70% at 50% -10%, var(--accent-glow),  transparent 65%),
        radial-gradient(ellipse 60% 50% at 85% 80%,  var(--accent-glow2), transparent 55%),
        var(--bg);
      z-index: 0;
    }
    .reel-card::after {
      content: '';
      position: absolute;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
      z-index: 1;
      pointer-events: none;
      opacity: 0.4;
    }

    .card-inner {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      height: 100%;
      justify-content: center;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
      padding-top: 8px;
    }
    .section-pill {
      font-size: 0.67rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 4px 12px;
      border-radius: 999px;
      background: var(--accent-pill);
      color: var(--accent-text);
    }
    .day-label {
      font-size: 0.72rem;
      font-weight: 500;
      color: var(--text-dim);
      letter-spacing: 0.04em;
    }

    .rule {
      width: 36px;
      height: 2px;
      background: var(--accent-rule);
      border-radius: 2px;
      margin: 0 0 20px;
      opacity: 0.7;
    }

    .card-title {
      font-family: var(--font-ser);
      font-size: clamp(1.3rem, 5vw, 1.65rem);
      font-weight: 700;
      color: var(--text);
      line-height: 1.25;
      margin-bottom: 22px;
      letter-spacing: -0.01em;
    }

    .verse-block {
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent-rule);
      border-radius: 10px;
      padding: 18px 20px;
      margin-bottom: 18px;
    }
    .verse-text {
      font-family: var(--font-ser);
      font-size: clamp(1.05rem, 4.2vw, 1.25rem);
      line-height: 1.75;
      color: var(--text);
      font-style: italic;
      margin-bottom: 8px;
    }
    .verse-ref {
      font-size: 0.73rem;
      font-weight: 600;
      color: var(--accent-ref);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .context-text {
      font-size: 0.88rem;
      line-height: 1.65;
      color: var(--text-dim);
      margin-bottom: 14px;
    }

    .thread-block {
      display: flex;
      gap: 9px;
      align-items: flex-start;
      padding: 12px 14px;
      background: rgba(255,255,255,0.03);
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.06);
      margin-bottom: 24px;
    }
    .thread-icon { font-size: 0.9rem; flex-shrink: 0; margin-top: 1px; }
    .thread-text { font-size: 0.8rem; line-height: 1.6; color: var(--text-faint); }
    .thread-text strong { color: var(--accent-ref); font-weight: 600; }

    .card-bottom {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      padding-bottom: 8px;
    }
    .btn-done {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: none;
      background: var(--accent-btn);
      color: var(--accent-btn-text);
      font-size: 0.9rem;
      font-weight: 600;
      font-family: var(--font-ui);
      cursor: pointer;
      transition: opacity 0.18s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
    }
    .btn-done:active { transform: scale(0.97); }
    .btn-done.done { background: rgba(255,255,255,0.08); color: var(--text-dim); border: 1px solid var(--border); }
    .swipe-hint {
      font-size: 0.7rem;
      color: var(--text-faint);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .swipe-hint::before, .swipe-hint::after {
      content: '';
      width: 20px; height: 1px;
      background: var(--text-faint);
      opacity: 0.5;
    }

    #progressBar {
      position: fixed; top: 0; left: 0; height: 2px;
      background: var(--accent-rule, #fff);
      transition: width 0.4s ease, background 0.6s;
      z-index: 100;
    }

    #navDots {
      position: fixed; right: 10px; top: 50%;
      transform: translateY(-50%);
      display: flex; flex-direction: column; gap: 5px;
      z-index: 100;
    }
    .nav-dot {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: rgba(255,255,255,0.2);
      cursor: pointer;
      transition: background 0.2s, transform 0.2s;
    }
    .nav-dot.active { background: rgba(255,255,255,0.85); transform: scale(1.4); }
    .nav-dot.done   { background: rgba(255,255,255,0.45); }

    #arrowUp, #arrowDown {
      position: fixed; right: 22px; z-index: 200;
      width: 36px; height: 36px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.07);
      color: rgba(255,255,255,0.6);
      font-size: 1rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      backdrop-filter: blur(8px);
      transition: background 0.15s, color 0.15s;
    }
    #arrowUp  { top: calc(50% - 46px); }
    #arrowDown{ top: calc(50% + 10px); }
    #arrowUp:hover, #arrowDown:hover { background: rgba(255,255,255,0.18); color: #fff; }
    #arrowUp:disabled, #arrowDown:disabled { opacity: 0.2; cursor: default; }

    #backLink {
      position: fixed;
      bottom: env(safe-area-inset-bottom, 16px);
      left: 16px; z-index: 100;
      font-size: 0.72rem;
      color: rgba(255,255,255,0.3);
      text-decoration: none;
      font-family: var(--font-ui);
      transition: color 0.2s;
    }
    #backLink:hover { color: rgba(255,255,255,0.6); }

    .reel-intro { text-align: center; padding: 40px 28px; }
    .intro-cross { font-size: 2.5rem; margin-bottom: 20px; display: block; }
    .intro-title {
      font-family: var(--font-ser);
      font-size: clamp(1.6rem, 6vw, 2rem);
      font-weight: 700; line-height: 1.2; margin-bottom: 12px;
    }
    .intro-sub {
      font-size: 0.9rem; color: var(--text-dim);
      line-height: 1.6; margin-bottom: 28px;
    }
    .intro-tags {
      display: flex; flex-wrap: wrap; gap: 8px;
      justify-content: center; margin-bottom: 28px;
    }
    .intro-tag {
      padding: 5px 13px; border: 1px solid var(--border);
      border-radius: 999px; font-size: 0.77rem; color: var(--text-dim);
    }
    .intro-start {
      font-size: 0.78rem; color: rgba(255,255,255,0.35);
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .arrow-bounce { animation: bounce 1.6s ease-in-out infinite; }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(5px); }
    }
  </style>
</head>

  call:      { label: 'The Call',           glow: 'rgba(161,98,7,0.22)',    glow2: 'rgba(100,60,5,0.12)',  pill: 'rgba(161,98,7,0.18)',    text: '#fbbf24', rule: '#d97706', ref: '#fbbf24', btn: '#92400e', btnText: '#fff' },
  integrity: { label: 'Integrity',          glow: 'rgba(15,118,110,0.22)',  glow2: 'rgba(5,80,70,0.12)',   pill: 'rgba(15,118,110,0.18)',  text: '#2dd4bf', rule: '#14b8a6', ref: '#2dd4bf', btn: '#115e59', btnText: '#fff' },
  courage:   { label: 'Courage',            glow: 'rgba(153,27,27,0.25)',   glow2: 'rgba(100,10,10,0.14)', pill: 'rgba(153,27,27,0.2)',    text: '#fca5a5', rule: '#ef4444', ref: '#fca5a5', btn: '#7f1d1d', btnText: '#fff' },
  servant:   { label: 'Servant Leader',     glow: 'rgba(29,78,216,0.22)',   glow2: 'rgba(10,40,150,0.12)', pill: 'rgba(29,78,216,0.18)',   text: '#93c5fd', rule: '#60a5fa', ref: '#93c5fd', btn: '#1e3a8a', btnText: '#fff' },
  warrior:   { label: 'Spiritual Warrior',  glow: 'rgba(67,56,202,0.22)',   glow2: 'rgba(40,20,150,0.12)', pill: 'rgba(67,56,202,0.18)',   text: '#a5b4fc', rule: '#818cf8', ref: '#a5b4fc', btn: '#312e81', btnText: '#fff' },
  godman:    { label: 'The God-Man',        glow: 'rgba(180,83,9,0.28)',    glow2: 'rgba(130,55,5,0.16)',  pill: 'rgba(180,83,9,0.22)',    text: '#fdba74', rule: '#f97316', ref: '#fdba74', btn: '#9a3412', btnText: '#fff' },

};

const DAYS = [

  // ── IDENTITY ─────────────────────────────────────────────
  {
    section: 'identity',
    title:   'Made in the Image of God',

    ref:     'Genesis 1:27',

    context: 'Before a man has a career, a title, an achievement, or a failure — he bears the image of God. This is the foundation of male identity: not performance, not prowess, not what others think, but the indelible stamp of his Creator. Every man is made to reflect and represent God in the world.',
    thread:  'Jesus is "the image of the invisible God" (Col 1:15) — the perfect human display of who God is. Every man is made to reflect what Jesus perfectly embodies. The goal of the Christian life is to be "conformed to the image of his Son" (Rom 8:29). Man\'s dignity begins in creation; his destiny is conformity to Christ.',

  {
    section: 'identity',
    title:   'Placed Here to Work and Guard',
    verse:   '"And the LORD God took the man, and put him into the garden of Eden to dress it and to keep it."',
    ref:     'Genesis 2:15',
    passage: 'Genesis 2:15',
    context: 'Before the Fall, before family, before sin — God gave man a mission: cultivate and protect. "Dress" means to work and develop; "keep" means to guard and defend. Purposeful labor and responsible stewardship were written into male identity before anything else went wrong.',
    thread:  '"My Father worketh hitherto, and I work" (John 5:17). Jesus, the Second Adam, came to do what the first Adam abandoned — work the Father\'s field, protect His flock, guard His people. "I lay down my life for the sheep" (John 10:15) is the ultimate act of "keeping." He is the faithful Keeper Adam was called to be.',
  },
  {
    section: 'identity',
    title:   'Where Art Thou? — Accountability',
    verse:   '"And the LORD God called unto Adam, and said unto him, Where art thou?"',
    ref:     'Genesis 3:9',
    passage: 'Genesis 3:6–12',
    context: 'When sin entered the world, Adam hid. He blamed his wife. He deflected. He covered himself. God\'s first recorded question to a man is a call to stop hiding and take account: "Where are you?" The fall of man is not merely theological — it is a man refusing to stand in the open before God.',
    thread:  'Jesus, the Second Adam, never hid. He set His face "steadfastly to go to Jerusalem" (Luke 9:51) — toward the cross, the judgment, the cup He did not want but did not refuse. "Not my will, but thine, be done" (Luke 22:42). Where the first man hid from God, the God-Man walked straight toward God\'s will at infinite cost to Himself.',
  },
  {
    section: 'identity',
    title:   'Man Looketh on the Outward Appearance',
    verse:   '"For the LORD seeth not as man seeth; for man looketh on the outward appearance, but the LORD looketh on the heart."',
    ref:     '1 Samuel 16:7',
    passage: '1 Samuel 16:1–13',
    context: 'Samuel comes to anoint a king and is drawn to the tall, impressive sons of Jesse. God stops him. The world selects for size, looks, and charisma. God selects for the heart. He passes over seven impressive sons and chooses David — the youngest, the shepherd, the overlooked one.',
    thread:  'Jesus came as "a root out of a dry ground: he hath no form nor comeliness; and when we shall see him, there is no beauty that we should desire him" (Isa 53:2). The world passed over Jesus. God exalted Him. A man\'s worth before God is not his appearance, status, or strength — it is the state of his heart before his King.',
  },

  // ── THE CALL ─────────────────────────────────────────────
  {
    section: 'call',
    title:   'Hear, O Israel — The Father\'s First Duty',
    verse:   '"And thou shalt love the LORD thy God with all thine heart, and with all thy soul, and with all thy might. And these words…thou shalt teach them diligently unto thy children."',

    passage: 'Deuteronomy 6:4–9',
    context: 'The Shema is Israel\'s creed, and Moses addresses it first to fathers. Love God with everything — then take that love and press it into your children: when you sit, when you walk, when you lie down, when you rise. Biblical manhood begins with vertical devotion and flows outward into deliberate discipleship of the next generation.',
    thread:  'Jesus called Deuteronomy 6:5 "the first and great commandment" (Matt 22:37–38). He lived it perfectly — loving the Father with every atom of His being, "I and my Father are one" (John 10:30). He then called His disciples not to a program but to a relationship: "Follow me." Every father who disciples his children images the Son discipling His own.',
  },
  {
    section: 'call',
    title:   'Be Strong and Courageous',
    verse:   '"Be strong and courageous. Do not be afraid; do not be discouraged, for the LORD your God will be with you wherever you go."',
    ref:     'Joshua 1:9',
    passage: 'Joshua 1:1–9',
    context: 'Moses is dead. Israel stands at the edge of the Promised Land. Joshua must lead two million people across the Jordan and into war. God does not give Joshua a battle plan — He gives him a command and a promise. Courage is not the absence of fear; it is obedience in the presence of fear, rooted in the presence of God.',
    thread:  'In Gethsemane, Jesus was "sorrowful and very heavy" (Matt 26:37) — He felt the full weight of what was coming. Yet He rose from prayer and walked straight toward the soldiers who came to arrest Him. "Be strong and courageous" was not a demand Jesus made of Himself — it was a reality He lived for us, so that His courage could become our foundation (Heb 12:2).',
  },
  {
    section: 'call',
    title:   'Show Thyself a Man',
    verse:   '"Be thou strong therefore, and shew thyself a man; And keep the charge of the LORD thy God, to walk in his ways."',

    passage: '1 Kings 2:1–4',
    context: 'David\'s last charge to his son Solomon is both tender and direct: be a man. But David immediately defines what that means — not wealth, not military power, not political shrewdness, but obedience to God. The measure of a man, in the end, is whether he walked with God.',

  },
  {
    section: 'call',
    title:   'The Whole Duty of Man',
    verse:   '"Fear God, and keep his commandments: for this is the whole duty of man. For God shall bring every work into judgment, with every secret thing."',
    ref:     'Ecclesiastes 12:13–14',
    passage: 'Ecclesiastes 12:9–14',
    context: 'After exhausting every earthly pursuit — wisdom, pleasure, labor, wealth — the Preacher arrives at a single conclusion: fear God and obey Him. Everything else is vanity. This is not a depressing end; it is a clarifying one. Life stripped of its distractions resolves to one question: did you walk with God?',
    thread:  'Jesus fulfilled every commandment (Matt 5:17) and "learned obedience by the things which he suffered" (Heb 5:8). The whole duty of man is perfectly embodied in the Son of Man. And because He kept every commandment perfectly on our behalf, men who trust Him are declared righteous — not by their performance, but by His. "He is made unto us wisdom, and righteousness, and sanctification, and redemption" (1 Cor 1:30).',

    thread:  'Jesus embodied all three simultaneously at the cross. Justice: sin was fully punished — God did not excuse it. Mercy: the sinner was fully pardoned — God did not ignore us. Humility: the Son of God "made himself of no reputation, and took upon him the form of a servant" (Phil 2:7). The cross is Micah 6:8 in flesh and blood.',
  },

  // ── INTEGRITY ────────────────────────────────────────────

    section: 'integrity',
    title:   'The Kinsman Who Kept His Word',

    context: 'Boaz was a wealthy man of standing who could have ignored a destitute Gentile widow. Instead, he pursued legal redemption — paying her debts, restoring her inheritance, and marrying her out of covenant loyalty. He did it openly, publicly, at personal cost. His word was his bond and his love was not sentimental but sacrificial.',
    thread:  'Boaz is the most explicit type of Christ in the Old Testament. To redeem, you must be kin (human) and able to pay the price. Jesus became flesh to be our kinsman and paid the price with His own blood (1 Pet 1:18–19). Boaz\'s integrity in keeping his covenant word anticipates Christ keeping His — at the cross.',
  },
  {
    section: 'integrity',
    title:   'Blessed Is the Man',
    verse:   '"Blessed is the man that walketh not in the counsel of the ungodly, nor standeth in the way of sinners, nor sitteth in the seat of the scornful. But his delight is in the law of the LORD."',

    passage: 'Psalm 1',
    context: 'The Psalter opens with a portrait of the man who flourishes: not the powerful, not the ambitious, but the man who has rooted himself in God\'s word. He doesn\'t drift with the crowd. He meditates on Scripture day and night. He is "like a tree planted by the rivers of water" — stable, fruitful, and unshakeable.',
    thread:  'Jesus is the Man of Psalm 1 in absolute fullness. When tempted in the wilderness, He answered every attack with "It is written" (Matt 4:4, 7, 10). His delight was the Father\'s will: "I delight to do thy will, O my God: yea, thy law is within my heart" (Ps 40:8). He is the tree planted by the river — and every man rooted in Him shares that stability.',

// ════════════════════════════════════════════════════════════
// STATE
// ════════════════════════════════════════════════════════════
let currentIdx = 0;
const TOTAL = DAYS.length + 1;

function getCompleted() {
  try { return new Set(JSON.parse(localStorage.getItem('manhood_reel_done')||'[]')); }
  catch(_) { return new Set(); }
}
function setCompleted(s) {
  try { localStorage.setItem('manhood_reel_done', JSON.stringify([...s])); } catch(_) {}
}

// ════════════════════════════════════════════════════════════
// NAVIGATION
// ════════════════════════════════════════════════════════════
function goTo(idx, animate = true) {
  if (idx < 0 || idx >= TOTAL) return;
  currentIdx = idx;
  const cards = document.querySelectorAll('.reel-card');
  if (!animate) cards.forEach(c => { c.style.transition = 'none'; });
  cards.forEach((card, i) => {
    card.classList.remove('active', 'prev');
    if (i < idx)       card.classList.add('prev');
    else if (i === idx) card.classList.add('active');
  });
  if (!animate) {
    requestAnimationFrame(() => { cards.forEach(c => { c.style.transition = ''; }); });
  }
  updateUI(idx);
}

function updateUI(idx) {
  const pct = Math.round((idx / (TOTAL - 1)) * 100);
  const bar = document.getElementById('progressBar');
  bar.style.width = pct + '%';
  if (idx > 0) bar.style.background = SECTIONS[DAYS[idx-1].section].rule;

  document.querySelectorAll('.nav-dot').forEach((dot, i) => {
    dot.classList.toggle('active', i === idx - 1);
  });
  document.getElementById('arrowUp').disabled   = (idx === 0);
  document.getElementById('arrowDown').disabled = (idx === TOTAL - 1);
}

// ════════════════════════════════════════════════════════════
// TOUCH SWIPE
// ════════════════════════════════════════════════════════════
let touchStartY = 0, touchStartTime = 0, swiping = false;

document.getElementById('reel').addEventListener('touchstart', e => {
  touchStartY    = e.touches[0].clientY;
  touchStartTime = Date.now();
  swiping        = true;
}, { passive: true });

document.getElementById('reel').addEventListener('touchend', e => {
  if (!swiping) return;
  swiping = false;
  const dy       = touchStartY - e.changedTouches[0].clientY;
  const dt       = Date.now() - touchStartTime;
  const velocity = Math.abs(dy) / dt;
  if (Math.abs(dy) > 40 || velocity > 0.35) goTo(currentIdx + (dy > 0 ? 1 : -1));
}, { passive: true });

// ════════════════════════════════════════════════════════════
// MOUSE WHEEL
// ════════════════════════════════════════════════════════════
let wheelCooldown = false;
document.getElementById('reel').addEventListener('wheel', e => {
  e.preventDefault();
  if (wheelCooldown) return;
  wheelCooldown = true;
  goTo(currentIdx + (e.deltaY > 0 ? 1 : -1));
  setTimeout(() => { wheelCooldown = false; }, 500);
}, { passive: false });

// ════════════════════════════════════════════════════════════
// KEYBOARD
// ════════════════════════════════════════════════════════════
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown' || e.key === ' ') { e.preventDefault(); goTo(currentIdx + 1); }
  if (e.key === 'ArrowUp')                    { e.preventDefault(); goTo(currentIdx - 1); }
});

// ════════════════════════════════════════════════════════════
// BUILD CARDS
// ════════════════════════════════════════════════════════════
function buildCards() {
  const done  = getCompleted();
  const track = document.getElementById('reelTrack');
  const dots  = document.getElementById('navDots');

  DAYS.forEach((d, i) => {
    const sec    = SECTIONS[d.section];
    const isDone = done.has(i);
    const div    = document.createElement('div');
    div.className   = 'reel-card';
    div.dataset.day = i + 1;
    div.style.cssText = `
      --accent-glow:  ${sec.glow};
      --accent-glow2: ${sec.glow2};
      --accent-pill:  ${sec.pill};
      --accent-text:  ${sec.text};
      --accent-rule:  ${sec.rule};
      --accent-ref:   ${sec.ref};
      --accent-btn:   ${sec.btn};
      --accent-btn-text: ${sec.btnText};
    `;
    div.innerHTML = `
      <div class="card-inner">
        <div class="card-top">
          <div class="section-pill">${sec.label}</div>
          <div class="day-label">${i+1} of ${DAYS.length}</div>
        </div>
        <div class="rule"></div>
        <div class="card-title">${d.title}</div>
        <div class="verse-block">
          <div class="verse-text">${d.verse}</div>
          <div class="verse-ref">${d.ref} &nbsp;·&nbsp; ${d.passage}</div>
        </div>
        <div class="context-text">${d.context}</div>
        <div class="thread-block">
          <span class="thread-icon">✝</span>
          <div class="thread-text">${d.thread}</div>
        </div>
        <div class="card-bottom">
          <button class="btn-done ${isDone?'done':''}" id="btnDone-${i}" onclick="toggleDone(${i})">
            ${isDone ? '✓ Completed' : '✓ Mark as Read'}
          </button>
          ${i < DAYS.length-1
            ? '<div class="swipe-hint">swipe up for next reading</div>'
            : '<div class="swipe-hint" style="color:rgba(255,255,255,0.5)">He who endures to the end shall be saved ✦</div>'}
        </div>
      </div>`;
    track.appendChild(div);
  });

  dots.innerHTML = DAYS.map((_, i) =>
    `<div class="nav-dot ${done.has(i)?'done':''}" id="dot-${i}"
      onclick="goTo(${i+1})" title="${i+1} of ${DAYS.length}"></div>`
  ).join('');
}

function toggleDone(index) {
  const done   = getCompleted();
  const isDone = done.has(index);
  isDone ? done.delete(index) : done.add(index);
  setCompleted(done);
  const btn = document.getElementById(`btnDone-${index}`);
  if (btn) { btn.className = isDone ? 'btn-done' : 'btn-done done'; btn.textContent = isDone ? '✓ Mark as Read' : '✓ Completed'; }
  const dot = document.getElementById(`dot-${index}`);
  if (dot) dot.classList.toggle('done', !isDone);
}

// ════════════════════════════════════════════════════════════
// INIT
// ════════════════════════════════════════════════════════════
buildCards();
goTo(0, false);
updateUI(0);
</script>
