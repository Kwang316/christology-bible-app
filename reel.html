<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <!-- iOS home-screen app mode -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Bible in 40 Days" />
  <meta name="theme-color" content="#07090f" />
  <title>Bible in 40 Days · 5 Minutes a Day</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #07090f;
      --card: rgba(255,255,255,0.035);
      --border: rgba(255,255,255,0.08);
      --text: #f0ece4;
      --text-dim: rgba(240,236,228,0.55);
      --text-faint: rgba(240,236,228,0.3);
      --font-ser: 'Libre Baskerville', Georgia, serif;
      --font-ui:  'Inter', system-ui, sans-serif;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-ui);
      overflow: hidden;
      touch-action: none; /* let JS handle all touch */
    }

    /* ── Viewport wrapper ── */
    #reel {
      position: fixed;
      inset: 0;
      overflow: hidden;
    }

    /* ── Cards: all stacked at the same position; classes slide them ── */
    .reel-card {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: env(safe-area-inset-top, 20px) 28px env(safe-area-inset-bottom, 24px);
      overflow: hidden;
      /* Default: below viewport */
      transform: translateY(100%);
      transition: transform 0.42s cubic-bezier(0.4, 0, 0.2, 1);
      pointer-events: none;
    }
    /* Active card: centred in viewport */
    .reel-card.active {
      transform: translateY(0);
      pointer-events: auto;
    }
    /* Already-visited card: above viewport */
    .reel-card.prev {
      transform: translateY(-100%);
      pointer-events: none;
    }

    /* Background gradient — set via inline style --accent */
    .reel-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 90% 70% at 50% -10%, var(--accent-glow), transparent 65%),
        radial-gradient(ellipse 60% 50% at 85% 80%,  var(--accent-glow2), transparent 55%),
        var(--bg);
      z-index: 0;
    }

    /* Noise texture overlay for warmth */
    .reel-card::after {
      content: '';
      position: absolute;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
      z-index: 1;
      pointer-events: none;
      opacity: 0.4;
    }

    /* All content sits above the bg */
    .card-inner {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 0;
      height: 100%;
      justify-content: center;
    }

    /* ── Top bar ── */
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
      padding-top: 8px;
    }
    .section-pill {
      font-size: 0.67rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 4px 12px;
      border-radius: 999px;
      background: var(--accent-pill);
      color: var(--accent-text);
    }
    .day-label {
      font-size: 0.72rem;
      font-weight: 500;
      color: var(--text-dim);
      letter-spacing: 0.04em;
    }

    /* ── Decorative rule ── */
    .rule {
      width: 36px;
      height: 2px;
      background: var(--accent-rule);
      border-radius: 2px;
      margin: 0 0 20px;
      opacity: 0.7;
    }

    /* ── Title ── */
    .card-title {
      font-family: var(--font-ser);
      font-size: clamp(1.3rem, 5vw, 1.65rem);
      font-weight: 700;
      color: var(--text);
      line-height: 1.25;
      margin-bottom: 22px;
      letter-spacing: -0.01em;
    }

    /* ── Verse ── */
    .verse-block {
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent-rule);
      border-radius: 10px;
      padding: 18px 20px;
      margin-bottom: 18px;
    }
    .verse-text {
      font-family: var(--font-ser);
      font-size: clamp(1.05rem, 4.2vw, 1.25rem);
      line-height: 1.75;
      color: var(--text);
      font-style: italic;
      margin-bottom: 8px;
    }
    .verse-ref {
      font-size: 0.73rem;
      font-weight: 600;
      color: var(--accent-ref);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /* ── Context ── */
    .context-text {
      font-size: 0.88rem;
      line-height: 1.65;
      color: var(--text-dim);
      margin-bottom: 14px;
    }

    /* ── Messianic thread ── */
    .thread-block {
      display: flex;
      gap: 9px;
      align-items: flex-start;
      padding: 12px 14px;
      background: rgba(255,255,255,0.03);
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.06);
      margin-bottom: 24px;
    }
    .thread-icon { font-size: 0.9rem; flex-shrink: 0; margin-top: 1px; }
    .thread-text {
      font-size: 0.8rem;
      line-height: 1.6;
      color: var(--text-faint);
    }
    .thread-text strong { color: var(--accent-ref); font-weight: 600; }

    /* ── Bottom controls ── */
    .card-bottom {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      padding-bottom: 8px;
    }
    .btn-done {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: none;
      background: var(--accent-btn);
      color: var(--accent-btn-text);
      font-size: 0.9rem;
      font-weight: 600;
      font-family: var(--font-ui);
      cursor: pointer;
      transition: opacity 0.18s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
    }
    .btn-done:active { transform: scale(0.97); }
    .btn-done.done { background: rgba(255,255,255,0.08); color: var(--text-dim); border: 1px solid var(--border); }
    .swipe-hint {
      font-size: 0.7rem;
      color: var(--text-faint);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .swipe-hint::before, .swipe-hint::after {
      content: '';
      width: 20px; height: 1px;
      background: var(--text-faint);
      opacity: 0.5;
    }

    /* ── Progress bar at top ── */
    #progressBar {
      position: fixed;
      top: 0;
      left: 0;
      height: 2px;
      background: var(--accent-rule, #fff);
      transition: width 0.4s ease, background 0.6s;
      z-index: 100;
    }

    /* ── Side nav dots ── */
    #navDots {
      position: fixed;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 5px;
      z-index: 100;
    }
    .nav-dot {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: rgba(255,255,255,0.2);
      cursor: pointer;
      transition: background 0.2s, transform 0.2s;
    }
    .nav-dot.active { background: rgba(255,255,255,0.85); transform: scale(1.4); }
    .nav-dot.done { background: rgba(255,255,255,0.45); }

    /* ── Arrow nav buttons ── */
    #arrowUp, #arrowDown {
      position: fixed;
      right: 22px;
      z-index: 200;
      width: 36px; height: 36px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.07);
      color: rgba(255,255,255,0.6);
      font-size: 1rem;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      backdrop-filter: blur(8px);
      transition: background 0.15s, color 0.15s;
    }
    #arrowUp  { top: calc(50% - 46px); }
    #arrowDown{ top: calc(50% + 10px); }
    #arrowUp:hover, #arrowDown:hover { background: rgba(255,255,255,0.18); color: #fff; }
    #arrowUp:disabled, #arrowDown:disabled { opacity: 0.2; cursor: default; }

    /* ── Back to app link ── */
    #backLink {
      position: fixed;
      bottom: env(safe-area-inset-bottom, 16px);
      left: 16px;
      z-index: 100;
      font-size: 0.72rem;
      color: rgba(255,255,255,0.3);
      text-decoration: none;
      font-family: var(--font-ui);
      transition: color 0.2s;
    }
    #backLink:hover { color: rgba(255,255,255,0.6); }

    /* ── Intro card (day 0) ── */
    .reel-intro {
      text-align: center;
      padding: 40px 28px;
    }
    .intro-cross {
      font-size: 2.5rem;
      margin-bottom: 20px;
      display: block;
    }
    .intro-title {
      font-family: var(--font-ser);
      font-size: clamp(1.6rem, 6vw, 2rem);
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: 12px;
    }
    .intro-sub {
      font-size: 0.9rem;
      color: var(--text-dim);
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .intro-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-bottom: 28px;
    }
    .intro-tag {
      padding: 5px 13px;
      border: 1px solid var(--border);
      border-radius: 999px;
      font-size: 0.77rem;
      color: var(--text-dim);
    }
    .intro-start {
      font-size: 0.78rem;
      color: rgba(255,255,255,0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .arrow-bounce {
      animation: bounce 1.6s ease-in-out infinite;
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(5px); }
    }
  </style>
</head>
<body>

<!-- Top progress bar -->
<div id="progressBar"></div>

<!-- Side nav dots -->
<div id="navDots"></div>

<!-- Back link -->
<a id="backLink" href="index.html">← Full App</a>

<!-- Nav arrows -->
<button id="arrowUp"   onclick="goTo(currentIdx-1)" aria-label="Previous">↑</button>
<button id="arrowDown" onclick="goTo(currentIdx+1)" aria-label="Next">↓</button>

<!-- Reel -->
<div id="reel">
  <div id="reelTrack">

    <!-- ── INTRO CARD ── -->
    <div class="reel-card reel-intro"
      style="
        --accent-glow:  rgba(180,134,14,0.18);
        --accent-glow2: rgba(100,60,10,0.12);
        --accent-pill:  rgba(180,134,14,0.15);
        --accent-text:  #d4a72a;
        --accent-rule:  #b5860e;
        --accent-ref:   #d4a72a;
        --accent-btn:   #b5860e;
        --accent-btn-text: #fff;
      "
      data-day="0">
      <div class="card-inner" style="justify-content:center">
        <span class="intro-cross">✝</span>
        <div class="intro-title">Bible in<br/>40 Days</div>
        <div class="intro-sub">
          5 minutes a day.<br/>
          The essential Messianic arc — from the first promise in Genesis<br/>to the final "Come, Lord Jesus" in Revelation.
        </div>
        <div class="intro-tags">
          <span class="intro-tag">40 days</span>
          <span class="intro-tag">5 min each</span>
          <span class="intro-tag">KJV</span>
          <span class="intro-tag">Christ-centered</span>
        </div>
        <div class="intro-start">
          <span class="arrow-bounce">↓</span>
          Swipe up or tap ↓ to begin
          <span class="arrow-bounce">↓</span>
        </div>
      </div>
    </div>

    <!-- Day cards injected directly into track by JS -->

  </div><!-- end reelTrack -->
</div><!-- end reel -->

<script>

// ════════════════════════════════════════════════════════════

  promise:     { label:'The Promise',      accent:'#a16207', glow:'rgba(161,98,7,0.22)',   glow2:'rgba(100,60,5,0.12)',  pill:'rgba(161,98,7,0.18)',   text:'#fbbf24', rule:'#d97706', ref:'#fbbf24', btn:'#92400e', btnText:'#fff' },

  {

// STATE
// ════════════════════════════════════════════════════════════
let currentIdx = 0;          // 0 = intro card
const TOTAL = DAYS.length + 1; // intro + 40 days

function getCompleted() {
  try { return new Set(JSON.parse(localStorage.getItem('reel_done')||'[]')); }
  catch(_) { return new Set(); }
}
function setCompleted(s) {
  try { localStorage.setItem('reel_done', JSON.stringify([...s])); } catch(_) {}
}

// ════════════════════════════════════════════════════════════
// NAVIGATION — CSS class toggling (active / prev / default)
// ════════════════════════════════════════════════════════════
function goTo(idx, animate = true) {
  if (idx < 0 || idx >= TOTAL) return;
  currentIdx = idx;
  const cards = document.querySelectorAll('.reel-card');
  if (!animate) {
    cards.forEach(c => { c.style.transition = 'none'; });
  }
  cards.forEach((card, i) => {
    card.classList.remove('active', 'prev');
    if (i < idx)      card.classList.add('prev');
    else if (i === idx) card.classList.add('active');
    // i > idx → default: translateY(100%) via CSS
  });
  if (!animate) {
    requestAnimationFrame(() => {
      cards.forEach(c => { c.style.transition = ''; });
    });
  }
  updateUI(idx);
}

function updateUI(idx) {
  // Progress bar
  const pct = Math.round((idx / (TOTAL - 1)) * 100);
  const bar = document.getElementById('progressBar');
  bar.style.width = pct + '%';
  if (idx > 0) {
    bar.style.background = SECTIONS[DAYS[idx-1].section].rule;
  }

  // Nav dots
  document.querySelectorAll('.nav-dot').forEach((dot, i) => {
    dot.classList.toggle('active', i === idx - 1);
  });

  // Arrow buttons
  document.getElementById('arrowUp').disabled   = (idx === 0);
  document.getElementById('arrowDown').disabled = (idx === TOTAL - 1);
}

// ════════════════════════════════════════════════════════════
// TOUCH SWIPE
// ════════════════════════════════════════════════════════════
let touchStartY = 0, touchStartTime = 0, swiping = false;

document.getElementById('reel').addEventListener('touchstart', e => {
  touchStartY    = e.touches[0].clientY;
  touchStartTime = Date.now();
  swiping        = true;
}, { passive: true });

document.getElementById('reel').addEventListener('touchend', e => {
  if (!swiping) return;
  swiping = false;
  const dy       = touchStartY - e.changedTouches[0].clientY;
  const dt       = Date.now() - touchStartTime;
  const velocity = Math.abs(dy) / dt;
  if (Math.abs(dy) > 40 || velocity > 0.35) {
    goTo(currentIdx + (dy > 0 ? 1 : -1));
  }
}, { passive: true });

// ════════════════════════════════════════════════════════════
// MOUSE WHEEL
// ════════════════════════════════════════════════════════════
let wheelCooldown = false;
document.getElementById('reel').addEventListener('wheel', e => {
  e.preventDefault();
  if (wheelCooldown) return;
  wheelCooldown = true;
  goTo(currentIdx + (e.deltaY > 0 ? 1 : -1));
  setTimeout(() => { wheelCooldown = false; }, 500);
}, { passive: false });

// ════════════════════════════════════════════════════════════
// KEYBOARD
// ════════════════════════════════════════════════════════════
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown' || e.key === ' ') { e.preventDefault(); goTo(currentIdx + 1); }
  if (e.key === 'ArrowUp')                    { e.preventDefault(); goTo(currentIdx - 1); }
});

// ════════════════════════════════════════════════════════════
// BUILD CARDS — injected directly into #reelTrack
// ════════════════════════════════════════════════════════════
function buildCards() {
  const done  = getCompleted();
  const track = document.getElementById('reelTrack');
  const dots  = document.getElementById('navDots');

  // Append day cards directly to track (siblings of intro card)
  DAYS.forEach((d, i) => {
    const sec    = SECTIONS[d.section];
    const isDone = done.has(i);
    const div    = document.createElement('div');
    div.className  = 'reel-card';
    div.dataset.day = i + 1;
    div.style.cssText = `
      --accent-glow:  ${sec.glow};
      --accent-glow2: ${sec.glow2};
      --accent-pill:  ${sec.pill};
      --accent-text:  ${sec.text};
      --accent-rule:  ${sec.rule};
      --accent-ref:   ${sec.ref};
      --accent-btn:   ${sec.btn};
      --accent-btn-text: ${sec.btnText};
    `;
    div.innerHTML = `
      <div class="card-inner">
        <div class="card-top">
          <div class="section-pill">${sec.label}</div>
          <div class="day-label">Day ${i+1} of ${DAYS.length}</div>
        </div>
        <div class="rule"></div>
        <div class="card-title">${d.title}</div>
        <div class="verse-block">
          <div class="verse-text">${d.verse}</div>
          <div class="verse-ref">${d.ref} &nbsp;·&nbsp; ${d.passage}</div>
        </div>
        <div class="context-text">${d.context}</div>
        <div class="thread-block">
          <span class="thread-icon">🔑</span>
          <div class="thread-text">${d.thread}</div>
        </div>
        <div class="card-bottom">
          <button class="btn-done ${isDone?'done':''}" id="btnDone-${i}" onclick="toggleDone(${i})">
            ${isDone ? '✓ Completed' : '✓ Mark as Read'}
          </button>
          ${i < DAYS.length-1
            ? '<div class="swipe-hint">swipe up for next day</div>'
            : '<div class="swipe-hint" style="color:rgba(255,255,255,0.5)">You\'ve finished the arc ✦</div>'}
        </div>
      </div>`;
    track.appendChild(div);
  });

  // Nav dots
  dots.innerHTML = DAYS.map((_, i) =>
    `<div class="nav-dot ${done.has(i)?'done':''}" id="dot-${i}"
      onclick="goTo(${i+1})" title="Day ${i+1}"></div>`
  ).join('');
}

function toggleDone(index) {
  const done = getCompleted();
  const isDone = done.has(index);
  isDone ? done.delete(index) : done.add(index);
  setCompleted(done);
  const btn = document.getElementById(`btnDone-${index}`);
  if (btn) { btn.className = isDone ? 'btn-done' : 'btn-done done'; btn.textContent = isDone ? '✓ Mark as Read' : '✓ Completed'; }
  const dot = document.getElementById(`dot-${index}`);
  if (dot) dot.classList.toggle('done', !isDone);
}

// ════════════════════════════════════════════════════════════
// INIT
// ════════════════════════════════════════════════════════════
buildCards();
goTo(0, false); // position without animation on load
updateUI(0);
</script>
